    if(!r||r<=0){toast(meta.mode==='time'?'Trag zuerst die Sekunden ein.':'Trag zuerst die Wiederholungen ein.');return;}
    let w=0;
    if(meta.mode==='load'||meta.mode==='bwload'){w=num(get('w'));if(w==null){if(meta.mode==='load'){toast('Trag zuerst das Gewicht ein.');return;}w=0;}}
    const rir=num(get('rir'));
    s.w=String(w).replace('.',',');s.r=String(r);s.rir=rir==null?'':String(rir);s.done=true;
    save();
    const allDone=e.sets.every(x=>x.done);
    startRest(p.rest,e.name);
    renderSession();
    if(allDone&&ei<S.active.ex.length-1){const nx=$('#ex'+(ei+1));if(nx)setTimeout(()=>nx.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}),250);}
  },
  addset(el){const e=S.active.ex[+el.dataset.ei];e.sets.push({w:'',r:'',rir:'',done:false});save();renderSession();},
  delset(el){const e=S.active.ex[+el.dataset.ei];if(e.sets.length>1){e.sets.pop();save();renderSession();}},
  restNow(el){const e=S.active.ex[+el.dataset.ei];startRest(PLAN[e.pid].rest,e.name);},
  restAdd(el){if(!rest)return;rest.end+=(+el.dataset.v)*1000;rest.total=Math.max(rest.total,Math.ceil((rest.end-Date.now())/1000));if(rest.end<=Date.now())rest=null;renderRest();},
  restSkip(){rest=null;renderRest();},
  rpe(el){const e=S.active.ex[+el.dataset.ei],v=+el.dataset.v;e.rpe=e.rpe===v?null:v;save();el.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===e.rpe)));},
  swap(el){openSheet(swapHtml(el.dataset.pid,el.dataset.ei??''),'swap');},
  swapTo(el){
    const pid=el.dataset.pid,name=el.dataset.v,p=PLAN[pid],ei=el.dataset.ei;
    if(name===p.name)delete S.swaps[pid];else S.swaps[pid]=name;
    if(ei!==''&&S.active&&S.active.ex[+ei]){const e=S.active.ex[+ei];e.name=name;e.sug=suggest(p,name,e.tRir,S.active.ctx,e.sets.length);}
    save();closeSheet();if(ui.sessionOpen)renderSession();render();toast(`Getauscht: ${name}`);
  },
  finish(){
    const a=S.active,dn=a.ex.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);
    if(!dn){askConfirm('Noch kein Satz abgehakt','Ohne abgehakte Sätze gibt es nichts zu speichern. Einheit verwerfen?','Verwerfen',discardNow);return;}
    ui.finRpe=null;openSheet(finishHtml(),'finish');
  },
  finRpe(el){ui.finRpe=+el.dataset.v;el.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));},
  saveFinish(){
    const note=$('#finNote')?$('#finNote').value:'';
    const s=completeSession(ui.finRpe,note);
    ui.finRpe=null;ui.sessionOpen=false;rest=null;ui.tab='home';
    renderSession();render();window.scrollTo(0,0);
    openSheet(summaryHtml(s),'summary');
  },
  discard(){askConfirm('Einheit verwerfen?','Alle Einträge dieser laufenden Einheit werden gelöscht.','Verwerfen',discardNow);},
  histToggle(el){ui.openHist=ui.openHist===el.dataset.v?null:el.dataset.v;const y=window.scrollY;render();window.scrollTo(0,y);},
  histDel(el){const id=el.dataset.v;askConfirm('Einheit löschen?','Die Einheit wird dauerhaft aus dem Verlauf und allen Statistiken entfernt.','Löschen',()=>{S.sessions=S.sessions.filter(s=>s.id!==id);save();render();toast('Einheit gelöscht');});},
  bodySave(){
    const date=($('#bDate').value||today());
    const e={};let any=false;
    BODY_F.forEach(([k])=>{const v=num($('#b_'+k).value);if(v!=null&&v>0){e[k]=v;any=true;}});
    if(!any){toast('Trag mindestens einen Wert ein.');return;}
    if(e.weight!=null&&(e.weight<35||e.weight>250)){toast('Das Gewicht wirkt unplausibel. Bitte prüfen.');return;}
    const ex=S.body.find(b=>b.date===date);
    if(ex)Object.assign(ex,e);else S.body.push(Object.assign({id:uid(),date},e));
    S.body.sort((a,b)=>a.date<b.date?-1:1);save();render();toast('Gespeichert');
  },
  csvOpen(){openSheet(csvHtml(),'csv');},
  csvShare(el){const [n,txt]=csvFile(el.dataset.v);shareCsv(n,txt);},
  async csvCopy(el){const [,txt]=csvFile(el.dataset.v);try{await navigator.clipboard.writeText(txt);toast('In die Zwischenablage kopiert');}catch(e){toast('Kopieren nicht möglich');}},
  bodyDel(el){const id=el.dataset.v;askConfirm('Eintrag löschen?','Dieser Messwert wird entfernt.','Löschen',()=>{S.body=S.body.filter(b=>b.id!==id);save();render();});},
  startDeload(){
    const t=today(),to=addDays(t,6),c=cycleInfo(t).cycle;
    S.deload={from:t,to};S.settings.cycleBase=c;S.settings.start=mondayOf(addDays(to,1));
    if(!S.settings.origin)S.settings.origin=mondayOf(t);
    save();if(ui.sheet&&ui.sheet.kind==='settings')openSheet(settingsHtml(),'settings');render();toast('Deload bis '+fmtDate(to,{weekday:'long'})+' aktiv');
  },
  endDeload(){S.deload=null;save();openSheet(settingsHtml(),'settings');render();toast('Deload beendet');},
  async exportData(){
    const txt=JSON.stringify(S);
    try{await navigator.clipboard.writeText(txt);toast('Sicherung in die Zwischenablage kopiert');}
    catch(e){openSheet(`<div class="sheet-h"><h3>Sicherung</h3><button class="icon-btn" data-a="sheetClose" aria-label="Schließen">${I.close}</button></div><p class="muted" style="margin:6px 0 12px">Text markieren, kopieren und sicher ablegen.</p><textarea class="inp" id="expTxt" rows="8" readonly>${esc(txt)}</textarea>`,'export');const ta=$('#expTxt');ta.focus();ta.select();}
  },
  importOpen(){openSheet(`<div class="sheet-h"><h3>Sicherung einspielen</h3><button class="icon-btn" data-a="sheetClose" aria-label="Schließen">${I.close}</button></div><p class="muted" style="margin:6px 0 12px">Füge den kopierten Sicherungstext ein. Die aktuellen Daten werden ersetzt.</p><textarea class="inp" id="impTxt" rows="8" placeholder="{&quot;v&quot;:1, …}"></textarea><div class="btn-row"><button class="btn" data-a="importDo">Einspielen</button></div>`,'import');},
  importDo(){
    let d;try{d=JSON.parse($('#impTxt').value);}catch(e){toast('Das ist kein gültiger Sicherungstext.');return;}
    if(!d||!Array.isArray(d.sessions)){toast('Sicherung unvollständig.');return;}
    askConfirm('Daten ersetzen?',`Die Sicherung enthält ${d.sessions.length} Einheiten. Deine aktuellen Daten werden überschrieben.`,'Ersetzen',()=>{S=normalize(d);S.settings.onboarded=true;save();applyTheme();ui.sessionOpen=false;renderSession();render();toast('Sicherung eingespielt');});
  },
  resetAll(){askConfirm('Alle Daten löschen?','Einheiten, Messwerte, Check-ins und Einstellungen werden unwiderruflich gelöscht. Kopiere vorher eine Sicherung, wenn du sie behalten willst.','Alles löschen',()=>{S=normalize(null);save();rest=null;ui.sessionOpen=false;renderSession();applyTheme();ui.tab='home';render();openSheet(onboardHtml(),'onboard',true);});},
  obDone(){
    const n=($('#obName').value||'').trim().slice(0,40),w=num($('#obWeight').value);
    S.settings.name=n;S.settings.start=S.settings.origin=mondayOf(today());S.settings.onboarded=true;
    if(w&&w>=35&&w<=250)S.body.push({id:uid(),date:today(),weight:w});
    save();closeSheet();render();toast(n?`Los geht's, ${n}.`:"Los geht's.");
  }
};
function discardNow(){S.active=null;save();rest=null;ui.sessionOpen=false;renderSession();render();toast('Einheit verworfen');}

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el)return;
  const f=A[el.dataset.a];if(!f)return;
  ev.preventDefault();
  try{f(el,ev);}catch(err){console.error(err);toast('Aktion fehlgeschlagen.');}
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(!t.dataset||!t.dataset.f||!S.active)return;
  const e=S.active.ex[+t.dataset.ei];if(!e)return;
  if(t.dataset.f==='note')e.note=t.value;
  else{const s=e.sets[+t.dataset.si];if(s)s[t.dataset.f]=t.value;}
  saveSoon();
});
document.addEventListener('change',ev=>{
  const t=ev.target,c=t.dataset&&t.dataset.c;if(!c)return;
  if(c==='setName'){S.settings.name=t.value.trim().slice(0,40);save();render();}
  else if(c==='setStart'&&t.value){S.settings.start=mondayOf(t.value);if(!S.settings.origin||S.settings.origin>S.settings.start)S.settings.origin=S.settings.start;S.settings.cycleBase=0;save();render();toast('Block beginnt am '+fmtDate(S.settings.start,{day:'numeric',month:'long'}));}
  else if(c==='prEx'){ui.prEx=t.value;render();}
  else if(c==='sched'){
    const i=+t.dataset.i,v=t.value,d=S.settings.days;
    if(v==='match'){const o=d.indexOf('match');if(o>=0&&o!==i){d[o]='rest';toast(`Spiel auf ${WD[i]} verlegt, ${WD[o]} ist jetzt Ruhetag`);}}
    d[i]=v;save();
    const box=$('#schedBox');if(box)box.innerHTML=schedEditor();
    if(!ui.sheet){const y=window.scrollY;render();window.scrollTo(0,y);}
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&ui.sheet&&!ui.sheet.locked)closeSheet();
  if(ev.key==='Enter'&&ev.target.classList&&ev.target.classList.contains('num')){
    const row=ev.target.closest('.set');const btn=row&&row.querySelector('[data-a="check"]');
    if(btn&&ev.target.dataset.f==='rir'){ev.preventDefault();btn.click();}
  }
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(ui.sessionOpen)requestWake();tick();}else save();});
window.addEventListener('pagehide',save);

function tick(){
  if(ui.sessionOpen&&S.active){const el=$('#elapsed');if(el)el.textContent=elapsed(S.active.start);}
  if(rest){
    if(Date.now()>=rest.end){rest=null;beep();renderRest();toast('Pause vorbei, nächster Satz.');}
    else renderRest();
  }
}
setInterval(tick,1000);

function makeIcon(){
  try{
    const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#FF8A45');g.addColorStop(1,'#E0480A');
    x.fillStyle='#0B0E13';x.fillRect(0,0,180,180);
    x.fillStyle=g;x.beginPath();x.arc(90,90,62,0,Math.PI*2);x.fill();
    x.strokeStyle='#0B0E13';x.lineWidth=12;x.lineCap='round';x.lineJoin='round';
    x.beginPath();x.moveTo(58,116);x.lineTo(58,66);x.lineTo(90,98);x.lineTo(122,66);x.lineTo(122,116);x.stroke();
    $('#touchIcon').setAttribute('href',c.toDataURL('image/png'));
  }catch(e){}
}

/* ---------- Init ---------- */
applyTheme();
if(S.active&&S.active.date!==today()&&(Date.now()-S.active.start)>18*3600*1000){
  render();
  askConfirm('Offene Einheit von '+fmtDate(S.active.date,{weekday:'long'}),'Diese Einheit wurde nie abgeschlossen. Speichern, was abgehakt ist, oder verwerfen?','Verwerfen',discardNow,'Speichern',()=>{const has=S.active.ex.some(e=>e.sets.some(s=>s.done));if(has){const s=completeSession(null,'');s.dur=Math.min(s.dur,120);save();render();toast('Einheit gespeichert');}else discardNow();});
}else{
  render();
  if(!S.settings.onboarded)openSheet(onboardHtml(),'onboard',true);
}
})();
</script>
</body>
</html>
